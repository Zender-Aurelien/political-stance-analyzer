name: Verify application and evidence pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENABLE_WATSONX: "false"
      ENABLE_WATSONX_BIOS: "false"
      OPEN_STATES_API_KEY: ""
      CLOUDANT_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
      - run: python scripts/check.py --report "${{ runner.temp }}/civic-verification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: ${{ runner.temp }}/civic-verification.json
